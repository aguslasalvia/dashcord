name: Build

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            platform: macos-latest # Intel (x86_64, cross-compiled)
            args: "--target x86_64-apple-darwin"
          - name: ubuntu
            platform: ubuntu-22.04
            args: ""
          - name: windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        working-directory: client
        run: bun run tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashcord-${{ matrix.name }}
          path: |
            client/src-tauri/target/**/release/bundle/**
          if-no-files-found: error
